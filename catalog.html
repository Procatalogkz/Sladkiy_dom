<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f5f5f7;
        --card-bg: #ffffff;
        --text: #1d1d1f;
        --muted: #86868b;
        --accent: #0066cc;
        --radius: 12px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.3;
        overflow: hidden;
      }
      .container { 
        max-width: 100%;
        margin: 0 auto; 
        padding: 0; 
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Шапка */
      .header { 
        flex-shrink: 0;
        margin-bottom: 0; 
        padding: 16px 16px 0; 
        background: var(--bg);
        z-index: 10;
      }
      .logo { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: -0.3px; }

      /* Поиск и фильтры */
      .filters { 
        flex-shrink: 0;
        padding: 0 16px; 
        margin-bottom: 0; 
        display: flex; 
        gap: 8px; 
        flex-wrap: wrap; 
        align-items: center; 
        background: var(--bg);
        z-index: 10;
      }
      .search-input { padding: 11px 18px; border: 1px solid #ddd; border-radius: 40px; font-size: 14px; flex: 1; min-width: 180px; outline: none; background: #fff; }
      .search-input:focus { border-color: var(--accent); }
      .filter-btn { background: #fff; border: 1px solid #ddd; padding: 8px 18px; border-radius: 40px; font-size: 13px; cursor: pointer; font-weight: 500; transition: 0.2s; white-space: nowrap; }
      .filter-btn:hover { border-color: var(--accent); }
      .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

      /* Контейнер-лента */
      #products-container {
        height: 100%;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        display: flex;
        flex-direction: column;
      }

      /* Карточка на весь экран */
      .product-card {
        min-height: 100vh;
        width: 100%;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        background: var(--bg);
        border: none;
        border-bottom: 1px solid rgba(0,0,0,0.05);
      }

      .product-img {
        /* Задаем фиксированную область для фото */
        width: 100%;
        height: 50vh;
        /* Магия выравнивания */
        object-fit: contain;
        object-position: center;
        /* Фон и декор */
        background: transparent;
        border-radius: var(--radius);
        transition: transform 0.3s ease;
        cursor: pointer;
      }
      /* На мобильных можно чуть уменьшить высоту, чтобы текст влез без скролла */
      @media (max-width: 600px) {
        .product-img {
          height: 45vh;
        }
      }

      .product-body {
        width: 100%;
        max-width: 400px;
        text-align: center;
        margin-top: 20px;
      }

      /* Обновленные стили для цен */
      .price-container {
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 40px;
        margin-top: 20px;
        padding: 15px 0;
      }
      .price-item {
        text-align: center;
      }
      .price-label {
        display: block;
        font-size: 10px;
        font-weight: 700;
        color: #a1a1a6;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .price-value {
        font-family: 'Inter', 'Roboto', sans-serif;
        font-size: 32px;
        font-weight: 900;
        color: var(--text);
        line-height: 1;
      }
      .price-value span {
        font-size: 20px;
        font-weight: 500;
        margin-left: 4px;
        color: var(--muted);
      }
      .price-value.accent {
        color: var(--accent);
      }

      /* Метки (badges) */
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        margin: 0 4px;
        background: #e05252;
        color: #fff;
        box-shadow: 0 2px 8px rgba(224,82,82,0.3);
      }

      /* Модальное окно с размытием */
      #image-modal {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }
      #image-modal.active {
        display: flex;
      }
      #modal-image {
        max-width: 95%;
        max-height: 90%;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      }

      /* Адаптация */
      @media (max-width: 600px) {
        .product-img { max-height: 40vh; }
        .product-body h2 { font-size: 20px; }
        .price-value { font-size: 28px !important; }
        .price-value span { font-size: 18px !important; }
      }
    </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo" style="cursor:pointer" onclick="window.location.href='index.html'">🛍 Каталог</div>
    </div>

    <!-- Фильтры -->
    <div class="filters">
      <input type="text" class="search-input" placeholder="🔍 Поиск по названию..." id="search" oninput="renderProducts()">
      <button class="filter-btn active" onclick="setActiveCategory('all')">Все</button>
      <div id="category-filters" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>

    <!-- Товары -->
    <div id="products-container"></div>
  </div>

  <!-- Модальное окно для просмотра изображения -->
  <div id="image-modal" onclick="closeImageModal()">
    <img id="modal-image" src="" alt="">
  </div>

  <script>
    // ═══════════════ НАСТРОЙКИ ═══════════════
    const SUPABASE_URL      = 'https://xvekrzgaavlozgghojwh.supabase.co';
    const SUPABASE_KEY      = 'sb_publishable_HqcMl3tsypuWQyh_RvIpVw_ZFU6khbB';
    const CLOUDINARY_NAME   = 'dggej5mco';

    // API-хелпер
    const API = (endpoint, options = {}) => {
      const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        ...(options.headers || {})
      };
      if (options.body && typeof options.body === 'object') {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
      }
      return fetch(url, { ...options, headers }).then(async res => {
        if (!res.ok) {
          const err = await res.text();
          throw new Error(`Supabase error ${res.status}: ${err}`);
        }
        if (res.status === 204) return null;
        return res.json();
      });
    };

    function cloudinaryUrl(publicId) {
      if (!publicId) return 'https://via.placeholder.com/800x800?text=No+Photo';
      // c_pad — добавляет пустые поля, чтобы подогнать под размер без обрезки
      // h_800,w_800 — делает "холст" квадратным 
      // b_transparent — делает поля прозрачными
      return `https://res.cloudinary.com/${CLOUDINARY_NAME}/image/upload/c_pad,b_transparent,h_800,w_800,f_auto,q_auto/v1/${publicId}`;
    }

    // Состояние
    let allProducts = [];
    let categories = [];
    let activeCategory = 'all';

    // Загрузка данных
    async function loadData() {
      try {
        categories = await API('categories?order=display_order');
        const prods = await API('products?select=*,categories(name),brands(name)&is_visible=eq.true&order=display_order');
        allProducts = prods;
        renderCategoryFilters();
        renderProducts();
      } catch (e) {
        console.error('Ошибка загрузки:', e);
      }
    }

    function renderCategoryFilters() {
      const container = document.getElementById('category-filters');
      container.innerHTML = categories.map(c => 
        `<button class="filter-btn ${activeCategory===c.id?'active':''}" onclick="setActiveCategory('${c.id}')">${c.name}</button>`
      ).join('');
    }

    window.setActiveCategory = function(catId) {
      activeCategory = catId;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      const allBtn = document.querySelector('.filter-btn');
      if (catId === 'all') {
        allBtn.classList.add('active');
      } else {
        document.querySelector(`.filter-btn[onclick="setActiveCategory('${catId}')"]`)?.classList.add('active');
      }
      renderProducts();
    };

    window.renderProducts = function() {
      const searchText = document.getElementById('search').value.toLowerCase();
      let filtered = allProducts;
      if (activeCategory !== 'all') filtered = filtered.filter(p => p.category_id === activeCategory);
      if (searchText) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchText));

      const grid = document.getElementById('products-container');
      if (!grid) {
        console.error("Контейнер 'products-container' не найден в HTML!");
        return;
      }
      grid.innerHTML = filtered.map(p => {
        const packPrice = (p.price_per_unit || 0) * (p.qty_per_pack || 1);
        const qty = p.qty_per_pack || 1;
        const badgesHtml = p.labels?.length ? p.labels.map(l => `<span class="badge">${l}</span>`).join('') : '';
        return `
          <div class="product-card">
            <img class="product-img" src="${cloudinaryUrl(p.image_public_id)}" alt="${escapeHtml(p.name)}" onclick="openImageModal(this.src)">
            <div class="product-body">
              <div style="font-size: 13px; margin-bottom: 10px; letter-spacing: 0.5px;">
                <span style="color: #d4a017; font-weight: 700; text-transform: uppercase;">${p.categories?.name || ''}</span>
                ${p.categories?.name && p.brands?.name ? ' <span style="color: #ddd">|</span> ' : ''}
                <span style="color: #2ecc71; font-weight: 700; text-transform: uppercase;">${p.brands?.name || ''}</span>
              </div>
              <h2 style="font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 25px;">${p.name}</h2>
              <div class="price-container">
                <div class="price-item">
                  <span class="price-label">1 ШТУКА</span>
                  <div class="price-value accent">${(p.price_per_unit || 0).toLocaleString()}<span>₸</span></div>
                </div>
                <div class="price-item">
                  <span class="price-label">УПАКОВКА (${qty})</span>
                  <div class="price-value">${packPrice.toLocaleString()}<span>₸</span></div>
                </div>
              </div>
              ${badgesHtml ? `<div style="margin-top: 25px;">${badgesHtml}</div>` : ''}
            </div>
          </div>`;
      }).join('');
    };

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // Модальное окно для просмотра изображений
    window.openImageModal = function(src) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-image');
      modalImg.src = src;
      modal.classList.add('active');
    };

    window.closeImageModal = function(e) {
      if (e && e.target !== e.currentTarget) return;
      const modal = document.getElementById('image-modal');
      modal.classList.remove('active');
    };

    // Закрытие модального окна по Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('image-modal');
        modal.classList.remove('active');
      }
    });

    // Инициализация
    loadData();
  </script>
</body>
</html>
