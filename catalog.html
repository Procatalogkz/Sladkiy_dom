<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f7f2;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #e8c547;
      --accent2: #c9a82c;
      --radius: 14px;
      --shadow: 0 5px 24px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.3;
    }
    .container { max-width: 100%; margin: 0 auto; padding: 0; }

    /* Шапка */
    .header { margin-bottom: 16px; padding: 16px 16px 0; }
    .logo { font-size: 30px; font-weight: 800; color: var(--accent2); letter-spacing: -0.3px; }

    /* Поиск и фильтры */
    .filters { padding: 0 16px; margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .search-input { padding: 11px 18px; border: 1px solid #ddd; border-radius: 40px; font-size: 14px; flex: 1; min-width: 180px; outline: none; background: #fff; }
    .search-input:focus { border-color: var(--accent); }
    .filter-btn { background: #fff; border: 1px solid #ddd; padding: 8px 18px; border-radius: 40px; font-size: 13px; cursor: pointer; font-weight: 500; transition: 0.2s; white-space: nowrap; }
    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

    /* Сетка товаров */
    .products-grid { display: flex; flex-direction: column; align-items: center; gap: 0; }

    /* Карточка */
    .product-card { font-family: 'Roboto', sans-serif; background: var(--card-bg); border-radius: 0; box-shadow: none; border-bottom: 8px solid var(--bg); overflow: hidden; width: 100%; max-width: 100%; display: flex; flex-direction: column; align-items: stretch; }
    .product-card:hover { transform: translateY(-3px); }

    /* Фото */
    .product-img { width: 100%; height: 82vw; max-height: 620px; object-fit: contain; object-position: center; background: #f0f0f0; display: block; }

    /* Тело карточки */
    .product-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

    /* Верхний ряд: категория, цены, бренд/метки */
    .product-top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .product-left { flex: 1; }
    .product-right { flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

    /* Цены */
    .product-prices { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 12px; }
    .price-item { display: flex; align-items: baseline; gap: 4px; }
    .price-label { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .price-value { font-weight: 700; font-size: 30px; color: #1a73e8; }
    .price-pack-value { font-weight: 700; font-size: 30px; color: #1a73e8; }

    /* Бренд и метки справа */
    .product-brand { font-size: 16px; font-style: italic; color: #2e7d32; white-space: nowrap; font-weight: 700; }
    .product-category-badge { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent2); border: 1px solid var(--accent2); padding: 4px 12px; border-radius: 12px; white-space: nowrap; }

    /* Название товара */
    .product-name { font-size: 20px; font-weight: 700; line-height: 1.2; color: #1a1a1a; }

    /* Метки */
    .product-badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
    .badge { background: #f0f0f0; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #444; }
    .badge.top { background: rgba(232,197,71,0.2); color: #9e7f1c; }
    .badge.shock { background: rgba(224,82,82,0.1); color: #c0392b; }
    .badge.new { background: rgba(82,201,122,0.15); color: #1e7e34; }
    .badge.hit { background: rgba(82,148,224,0.15); color: #1f5fa0; }

    /* Адаптация */
    @media (max-width: 600px) {
      .product-card { width: 100%; }
      .product-body { padding: 8px 10px; }
      .product-name { font-size: 15px; }
    }

    /* Модальное окно для просмотра изображения */
    .image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .image-modal.active { display: flex; }
    .image-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .image-modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🛍 Каталог</div>
    </div>

    <!-- Фильтры -->
    <div class="filters">
      <input type="text" class="search-input" placeholder="🔍 Поиск по названию..." id="search" oninput="renderProducts()">
      <button class="filter-btn active" onclick="setActiveCategory('all')">Все</button>
      <div id="category-filters" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>

    <!-- Товары -->
    <div class="products-grid" id="products-container"></div>
  </div>

  <!-- Модальное окно для просмотра изображения -->
  <div class="image-modal" id="image-modal" onclick="closeImageModal(event)">
    <button class="image-modal-close" onclick="closeImageModal(event)">×</button>
    <img id="modal-image" src="" alt="">
  </div>

  <script>
    // ═══════════════ НАСТРОЙКИ ═══════════════
    const SUPABASE_URL      = 'https://xvekrzgaavlozgghojwh.supabase.co';
    const SUPABASE_KEY      = 'sb_publishable_HqcMl3tsypuWQyh_RvIpVw_ZFU6khbB';
    const CLOUDINARY_NAME   = 'dggej5mco';

    // API-хелпер
    const API = (endpoint, options = {}) => {
      const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        ...(options.headers || {})
      };
      if (options.body && typeof options.body === 'object') {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
      }
      return fetch(url, { ...options, headers }).then(async res => {
        if (!res.ok) {
          const err = await res.text();
          throw new Error(`Supabase error ${res.status}: ${err}`);
        }
        if (res.status === 204) return null;
        return res.json();
      });
    };

    function cloudinaryUrl(publicId) {
      return publicId 
        ? `https://res.cloudinary.com/${CLOUDINARY_NAME}/image/upload/f_auto,q_auto,w_500/v1/${publicId}` 
        : 'https://via.placeholder.com/400x300?text=No+Photo';
    }

    // Состояние
    let allProducts = [];
    let categories = [];
    let activeCategory = 'all';

    // Загрузка данных
    async function loadData() {
      try {
        categories = await API('categories?order=display_order');
        const prods = await API('products?select=*,categories(name),brands(name)&is_visible=eq.true&order=display_order');
        allProducts = prods;
        renderCategoryFilters();
        renderProducts();
      } catch (e) {
        console.error('Ошибка загрузки:', e);
      }
    }

    function renderCategoryFilters() {
      const container = document.getElementById('category-filters');
      container.innerHTML = categories.map(c => 
        `<button class="filter-btn ${activeCategory===c.id?'active':''}" onclick="setActiveCategory('${c.id}')">${c.name}</button>`
      ).join('');
    }

    window.setActiveCategory = function(catId) {
      activeCategory = catId;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      const allBtn = document.querySelector('.filter-btn');
      if (catId === 'all') {
        allBtn.classList.add('active');
      } else {
        document.querySelector(`.filter-btn[onclick="setActiveCategory('${catId}')"]`)?.classList.add('active');
      }
      renderProducts();
    };

    window.renderProducts = function() {
      const searchText = document.getElementById('search').value.toLowerCase();
      let filtered = allProducts;
      if (activeCategory !== 'all') filtered = filtered.filter(p => p.category_id === activeCategory);
      if (searchText) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchText));

      const grid = document.getElementById('products-container');
      grid.innerHTML = filtered.map(p => {
        const cat = p.categories;
        const brand = p.brands;
        const pricePerUnit = p.price_per_unit || 0;
        const qty = p.qty_per_pack || 1;
        const packPrice = pricePerUnit * qty;

        const badgeLabels = p.labels || [];
        const badgesHtml = badgeLabels.map(l => {
          let cls = '';
          if (l === 'Топ') cls = 'top';
          else if (l === 'Шок цена') cls = 'shock';
          else if (l === 'Новинка') cls = 'new';
          else if (l === 'Хит') cls = 'hit';
          return `<span class="badge ${cls}">${l}</span>`;
        }).join('');

        return `
          <div class="product-card">
            <img class="product-img" src="${cloudinaryUrl(p.image_public_id)}" alt="${escapeHtml(p.name)}" onclick="openImageModal('${cloudinaryUrl(p.image_public_id)}')">
            <div class="product-body">
              <div class="product-top-row">
                <div class="product-left">
                  <div class="product-category-badge">${cat?.name || ''}</div>
                </div>
                <div class="product-prices">
                  <div class="price-item">
                    <span class="price-label">1 шт</span>
                    <span class="price-value">${pricePerUnit.toLocaleString()} ₸</span>
                  </div>
                  <div class="price-item">
                    <span class="price-label">уп.</span>
                    <span class="price-pack-value">${packPrice.toLocaleString()} ₸</span>
                  </div>
                </div>
                <div class="product-right">
                  <div class="product-brand">${brand?.name || ''}</div>
                  ${badgesHtml ? `<div class="product-badges">${badgesHtml}</div>` : ''}
                </div>
              </div>
              <div class="product-bottom-row">
                <div class="product-name" title="${escapeHtml(p.name)}">${p.name}</div>
              </div>
            </div>
          </div>`;
      }).join('');
    };

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // Модальное окно для просмотра изображений
    window.openImageModal = function(src) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-image');
      modalImg.src = src;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.closeImageModal = function(e) {
      if (e && e.target !== e.currentTarget && e.target.className !== 'image-modal-close') return;
      const modal = document.getElementById('image-modal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    };

    // Инициализация
    loadData();
  </script>
</body>
</html>
