<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCatalogKz — Главная</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #131313;
            --accent: #e8c547;
            --text: #f0ede8;
            --muted: #6e6e6e;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
        }
        .logo {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 40px;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            min-width: 200px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg2);
            color: var(--text);
        }
        .btn:hover {
            background: #222;
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .btn.accent {
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: 700;
        }
        .btn.accent:hover {
            background: #c9a82c;
        }
        .btns-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btns-row .btn {
            flex: 1;
            min-width: 180px;
            max-width: 280px;
            padding: 12px 40px;
            font-size: 16px;
        }
        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg2);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius);
            padding: 30px;
            max-width: 360px;
            width: 100%;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal .fg {
            margin-bottom: 16px;
        }
        .modal .fg label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .modal input {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.12);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .modal input:focus {
            border-color: var(--accent);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px 16px;
            font-size: 14px;
            min-width: 0;
        }
        .error-msg {
            color: #e05252;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        @media (max-width: 400px) {
            .btn { padding: 10px 20px; font-size: 14px; min-width: 0; }
            .logo { font-size: 28px; }
            .btns-row { flex-direction: column; align-items: center; }
            .btns-row .btn { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛍 ProCatalogKz</div>
        <div class="btns-row">
            <a href="catalog.html" class="btn accent">📦 Каталог</a>
            <button class="btn" onclick="openLoginModal()">⚙️ Админ-панель</button>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal">
            <div class="modal-title">🔐 Вход в Админ-панель</div>
            <div class="fg">
                <label>Логин</label>
                <input type="text" id="login-username" placeholder="Введите логин" autocomplete="username">
            </div>
            <div class="fg">
                <label>Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль" autocomplete="current-password">
            </div>
            <div class="error-msg" id="login-error">Неверный логин или пароль</div>
            <div class="modal-actions">
                <button class="btn" onclick="closeLoginModal()">Отмена</button>
                <button class="btn accent" onclick="attemptLogin()">Войти</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USER = 'Sd1';
        const ADMIN_PASS = 'Sd123123';

        function openLoginModal() {
            document.getElementById('login-modal').classList.add('open');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-error').style.display = 'none';
            setTimeout(() => document.getElementById('login-username').focus(), 100);
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.remove('open');
        }

        function attemptLogin() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                closeLoginModal();
                window.location.href = 'admin.html';
            } else {
                document.getElementById('login-error').style.display = 'block';
                document.getElementById('login-password').value = '';
                setTimeout(() => document.getElementById('login-username').focus(), 50);
            }
        }

        // Закрытие по Escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLoginModal();
        });

        // Закрытие по клику на фон
        document.getElementById('login-modal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeLoginModal();
        });

        // Enter для входа
        document.getElementById('login-password').addEventListener('keypress', e => {
            if (e.key === 'Enter') attemptLogin();
        });
    </script>
</body>
</html>
