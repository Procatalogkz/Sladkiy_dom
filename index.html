<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МамаКаталог — Главная</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #131313;
            --accent: #e8c547;
            --text: #f0ede8;
            --muted: #6e6e6e;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
        }
        .logo {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            border-radius: var(--radius);
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            min-width: 200px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg2);
            color: var(--text);
        }
        .btn:hover {
            background: #222;
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .btn.accent {
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: 700;
        }
        .btn.accent:hover {
            background: #c9a82c;
        }
        @media (max-width: 400px) {
            .btn { padding: 14px 20px; font-size: 16px; }
            .logo { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛍 МамаКаталог</div>
        <div class="buttons">
            <a href="catalog.html" class="btn accent">📦 Каталог</a>
            <a href="admin.html" class="btn">⚙️ Админ-панель</a>
        </div>
    </div>
</body>
</html>
